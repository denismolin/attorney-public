{% extends "base.html" %}
{% block title %}Connexion — Assistant juridique v{{ app_version }}{% endblock %}
{% block content %}
<div class="panel">
  <h1>Connexion</h1>
  {% if error %}
  <p class="notice error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" class="stack">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label class="field">Identifiant
      <input type="text" name="username" class="input" autocomplete="username" autofocus required>
    </label>
    <label class="field">Mot de passe
      <input type="password" name="password" class="input" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn-block">Se connecter</button>
  </form>
</div>
<p class="muted" style="text-align:center; font-size:var(--text-xs);">v{{ app_version }}</p>
{% endblock %}
