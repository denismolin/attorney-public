<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Succession DUPONT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main style="max-width: 380px; margin: 4rem auto;">
    <div class="panel">
      <h1>⚖️ Connexion</h1>
      {% if error %}
      <p class="ko" style="margin-bottom:0.8rem;">{{ error }}</p>
      {% endif %}
      <form method="post" style="display:flex; flex-direction:column; gap:0.8rem;">
        <label>Identifiant
          <input type="text" name="username" class="eval-select" style="width:100%;" autofocus required>
        </label>
        <label>Mot de passe
          <input type="password" name="password" class="eval-select" style="width:100%;" required>
        </label>
        <button type="submit" style="margin-top:0.4rem;">Se connecter</button>
      </form>
    </div>
  </main>
</body>
</html>
