{% extends "base.html" %}
{% block title %}{{ title }} — Assistant juridique{% endblock %}
{% block content %}
<div class="panel">
  <div class="empty-state">
    <strong>{{ title }}</strong>
    <p>{{ message }}</p>
    <div class="btn-row" style="justify-content:center;">
      {% if current_user.is_authenticated %}
      <a class="btn" href="{{ url_for('home_page') }}">Retour à l'accueil</a>
      {% else %}
      <a class="btn" href="{{ url_for('login_page') }}">Se connecter</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
